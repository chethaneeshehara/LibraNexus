<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - LibraNexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --navy-900: #0B132B;
      --navy-800: #1C2541;
      --navy-700: #2D3748;
      --teal-500: #0D9488;
      --teal-400: #14B8A6;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --bg-light: #F8FAFC;
      --border: #E2E8F0;
      --border-focus: #818CF8;
      --white: #FFFFFF;

      --shadow-sm:
        0 1px 2px 0 rgb(0 0 0 / 0.05);

      --shadow-md:
        0 4px 6px -1px rgb(0 0 0 / 0.1),
        0 2px 4px -2px rgb(0 0 0 / 0.1);

      --shadow-xl:
        0 20px 25px -5px rgb(0 0 0 / 0.1),
        0 8px 10px -6px rgb(0 0 0 / 0.1);

      --shadow-2xl:
        0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background-color: #0F172A;

      background-image:
        radial-gradient(
          at 0% 0%,
          rgba(79, 70, 229, 0.15) 0px,
          transparent 50%
        ),
        radial-gradient(
          at 100% 100%,
          rgba(13, 148, 136, 0.15) 0px,
          transparent 50%
        );

      padding: 1.5rem;

      color: var(--text-dark);
    }

    /* ========================================
       CONTAINER
    ======================================== */

    .login-wrapper {
      width: 100%;
      max-width: 1040px;
      min-height: 640px;

      background: var(--white);

      border-radius: 24px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      overflow: hidden;

      box-shadow: var(--shadow-2xl);
    }

    /* ========================================
       LEFT VISUAL SIDE
    ======================================== */

    .visual-side {
      position: relative;

      background:
        linear-gradient(
          135deg,
          rgba(11, 19, 43, 0.85),
          rgba(28, 37, 65, 0.75)
        ),
        url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?auto=format&fit=crop&q=80&w=1200')
        center / cover no-repeat;

      padding: 3.5rem 3rem;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      color: var(--white);

      overflow: hidden;
    }

    .visual-side::before {
      content: '';

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      background:
        radial-gradient(
          circle at top left,
          rgba(79, 70, 229, 0.3),
          transparent 70%
        );

      pointer-events: none;
    }

    /* ========================================
       BRAND
    ======================================== */

    .brand-header {
      position: relative;

      z-index: 2;

      display: flex;
      align-items: center;

      gap: 0.75rem;

      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      background: var(--primary);

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--white);

      box-shadow:
        0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .brand-name {
      font-size: 1.5rem;

      font-weight: 800;

      letter-spacing: -0.025em;

      color: var(--white);
    }

    .brand-name span {
      color: #818CF8;
    }

    /* ========================================
       QUOTE
    ======================================== */

    .quote-box {
      position: relative;

      z-index: 2;

      max-width: 400px;
    }

    .quote-icon {
      color: var(--teal-400);

      margin-bottom: 1rem;

      opacity: 0.9;
    }

    .quote-text {
      font-size: 1.45rem;

      font-weight: 700;

      line-height: 1.4;

      margin-bottom: 1.25rem;

      letter-spacing: -0.02em;

      color: #F8FAFC;
    }

    .quote-author {
      font-size: 0.875rem;

      color: var(--text-light);

      font-weight: 500;

      display: flex;
      align-items: center;

      gap: 0.5rem;
    }

    .quote-author::before {
      content: '';

      display: inline-block;

      width: 16px;
      height: 2px;

      background: var(--teal-400);
    }

    /* ========================================
       RIGHT FORM SIDE
    ======================================== */

    .form-side {
      padding: 3.5rem;

      display: flex;
      flex-direction: column;
      justify-content: center;

      background: var(--white);

      position: relative;
    }

    .form-header {
      margin-bottom: 2rem;
    }

    .badge-tag {
      display: inline-block;

      font-size: 0.75rem;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.1em;

      color: var(--primary);

      margin-bottom: 0.5rem;
    }

    .form-title {
      font-size: 2rem;

      font-weight: 800;

      color: var(--navy-900);

      letter-spacing: -0.03em;

      margin-bottom: 0.5rem;
    }

    .form-subtitle {
      font-size: 0.925rem;

      color: var(--text-muted);

      font-weight: 500;
    }

    /* ========================================
       LOGIN FORM
    ======================================== */

    .login-form {
      display: flex;

      flex-direction: column;

      gap: 1.25rem;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 0.4rem;
    }

    .form-label {
      font-size: 0.85rem;

      font-weight: 600;

      color: var(--navy-900);
    }

    .input-wrapper {
      position: relative;

      display: flex;

      align-items: center;
    }

    .input-icon {
      position: absolute;

      left: 1rem;

      color: var(--text-light);

      pointer-events: none;

      transition: color 0.2s;
    }

    .form-input {
      width: 100%;

      padding:
        0.85rem
        1rem
        0.85rem
        2.75rem;

      border: 1.5px solid var(--border);

      border-radius: 12px;

      font-size: 0.95rem;

      color: var(--text-dark);

      background-color: var(--white);

      outline: none;

      transition: all 0.2s ease;

      font-weight: 500;
    }

    .form-input::placeholder {
      color: #94A3B8;
    }

    .form-input:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    /* ========================================
       PASSWORD TOGGLE
    ======================================== */

    .toggle-password {
      position: absolute;

      right: 1rem;

      background: none;

      border: none;

      color: var(--text-light);

      cursor: pointer;

      display: flex;

      align-items: center;

      padding: 0;

      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--text-dark);
    }

    /* ========================================
       FORM ACTIONS
    ======================================== */

    .form-actions {
      display: flex;

      align-items: center;

      justify-content: space-between;

      font-size: 0.85rem;

      margin-top: 0.25rem;
    }

    .remember-me {
      display: flex;

      align-items: center;

      gap: 0.5rem;

      cursor: pointer;

      color: var(--text-muted);

      font-weight: 500;

      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;

      accent-color: var(--primary);

      border-radius: 4px;

      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);

      text-decoration: none;

      font-weight: 600;

      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--primary-hover);

      text-decoration: underline;
    }

    /* ========================================
       LOGIN BUTTON
    ======================================== */

    .btn-submit {
      width: 100%;

      padding: 0.9rem;

      background-color: var(--primary);

      color: var(--white);

      border: none;

      border-radius: 12px;

      font-size: 0.975rem;

      font-weight: 700;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 0.5rem;

      transition: all 0.2s ease;

      box-shadow:
        0 4px 12px rgba(79, 70, 229, 0.25);

      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);

      transform: translateY(-1px);

      box-shadow:
        0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* ========================================
       DIVIDER
    ======================================== */

    .divider {
      display: flex;

      align-items: center;

      text-align: center;

      margin: 1.5rem 0;

      color: var(--text-light);

      font-size: 0.8rem;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: '';

      flex: 1;

      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 0.75rem;
    }

    /* ========================================
       GOOGLE BUTTON
    ======================================== */

    .btn-google {
      width: 100%;

      padding: 0.85rem;

      background-color: var(--white);

      color: var(--navy-900);

      border: 1.5px solid var(--border);

      border-radius: 12px;

      font-size: 0.925rem;

      font-weight: 600;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 0.75rem;

      transition: all 0.2s ease;
    }

    .btn-google:hover {
      background-color: var(--bg-light);

      border-color: #CBD5E1;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    /* ========================================
       REGISTER FOOTER
    ======================================== */

    .register-footer {
      margin-top: 2rem;

      text-align: center;

      font-size: 0.875rem;

      color: var(--text-muted);

      font-weight: 500;
    }

    .register-link {
      color: var(--primary);

      font-weight: 700;

      text-decoration: none;

      margin-left: 0.25rem;

      transition: color 0.2s;
    }

    .register-link:hover {
      color: var(--primary-hover);

      text-decoration: underline;
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 900px) {

      .login-wrapper {
        grid-template-columns: 1fr;

        max-width: 480px;

        min-height: auto;
      }

      .visual-side {
        display: none;
      }

      .form-side {
        padding: 2.5rem 2rem;
      }
    }

    @media (max-width: 480px) {

      body {
        padding: 1rem;
      }

      .form-side {
        padding: 2rem 1.5rem;
      }

      .form-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- ========================================
         LEFT VISUAL PANEL
    ======================================== -->

    <div class="visual-side">

      <div class="brand-header">

        <div class="brand-icon">
          <i data-lucide="book-open" size="22"></i>
        </div>

        <div class="brand-name">
          Libra<span>Nexus</span>
        </div>

      </div>


      <div class="quote-box">

        <div class="quote-icon">
          <i data-lucide="quote" size="36"></i>
        </div>

        <p class="quote-text">
          A library is not a luxury, but one of the necessities of life.
        </p>

        <div class="quote-author">
          Henry Ward Beecher
        </div>

      </div>

    </div>


    <!-- ========================================
         RIGHT FORM PANEL
    ======================================== -->

    <div class="form-side">

      <div class="form-header">

        <span class="badge-tag">
          Member Access
        </span>

        <h1 class="form-title">
          Welcome back
        </h1>

        <p class="form-subtitle">
          Enter your details to continue to your library.
        </p>

      </div>


      <!-- Login Form -->

      <form
        class="login-form"
        onsubmit="handleLogin(event)"
      >

        <!-- Email -->

        <div class="form-group">

          <label
            class="form-label"
            for="email"
          >
            Email address
          </label>

          <div class="input-wrapper">

            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="sofia@university.edu"
              required
              autocomplete="email"
            >

            <i
              data-lucide="mail"
              class="input-icon"
              size="18"
            ></i>

          </div>

        </div>


        <!-- Password -->

        <div class="form-group">

          <label
            class="form-label"
            for="password"
          >
            Password
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >

            <i
              data-lucide="lock"
              class="input-icon"
              size="18"
            ></i>

            <button
              type="button"
              class="toggle-password"
              onclick="togglePasswordVisibility()"
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
            >

              <i
                data-lucide="eye"
                id="eyeIcon"
                size="18"
              ></i>

            </button>

          </div>

        </div>


        <!-- Options -->

        <div class="form-actions">

          <label class="remember-me">

            <input
              type="checkbox"
              id="remember"
            >

            <span>
              Remember me
            </span>

          </label>


          <!-- Forgot Password
               Placeholder for now -->

          <a
            href="#"
            class="forgot-link"
          >
            Forgot password?
          </a>

        </div>


        <!-- Login Button -->

        <button
          type="submit"
          class="btn-submit"
        >

          <span>
            Continue to dashboard
          </span>

          <i
            data-lucide="arrow-right"
            size="18"
          ></i>

        </button>

      </form>


      <!-- Divider -->

      <div class="divider">

        <span>
          or continue with
        </span>

      </div>


      <!-- Google Sign In -->

      <button
        type="button"
        class="btn-google"
        onclick="handleGoogleLogin()"
      >

        <svg
          class="google-icon"
          viewBox="0 0 24 24"
        >

          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />

          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />

          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
          />

          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
          />

        </svg>

        <span>
          Google
        </span>

      </button>


      <!-- ========================================
           REGISTER LINK
           FIXED: Login → Register
      ======================================== -->

      <div class="register-footer">

        Don't have an account?

        <a
          href="{{ url_for('register') }}"
          class="register-link"
        >
          Create one
        </a>

      </div>

    </div>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ======================================== -->

  <script>

    // Initialize Lucide Icons
    lucide.createIcons();


    // ========================================
    // Toggle Password Visibility
    // ========================================

    function togglePasswordVisibility() {

      const passwordInput =
        document.getElementById('password');

      const eyeIcon =
        document.getElementById('eyeIcon');


      if (passwordInput.type === 'password') {

        passwordInput.type = 'text';

        eyeIcon.setAttribute(
          'data-lucide',
          'eye-off'
        );

      } else {

        passwordInput.type = 'password';

        eyeIcon.setAttribute(
          'data-lucide',
          'eye'
        );
      }

      lucide.createIcons();
    }


    // ========================================
    // Login Form Handler
    // ========================================

    function handleLogin(event) {

      event.preventDefault();

      const email =
        document.getElementById('email').value;

      // Temporary UI behaviour.
      // Actual authentication will be connected
      // with Flask + MySQL later.

      alert(`Logging in with: ${email}`);
    }


    // ========================================
    // Google Login Handler
    // ========================================

    function handleGoogleLogin() {

      alert(
        'Connecting to Google Authentication...'
      );
    }

  </script>

</body>
</html>
